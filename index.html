<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/react-burger/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Burgers</title>
    <script>
      ((location) => {
        const redirect = location.search.slice(1);

        if (!redirect.startsWith('/')) {
          return;
        }

        const restoredPath = redirect
          .split('&')
          .map((part) => part.replace(/~and~/g, '&'))
          .join('?');

        window.history.replaceState(
          null,
          '',
          `${location.pathname.slice(0, -1)}${restoredPath}${location.hash}`
        );
      })(window.location);
    </script>
    <script type="module" crossorigin src="/react-burger/assets/index-DX0mUiRl.js"></script>
    <link rel="stylesheet" crossorigin href="/react-burger/assets/index-Bl0Ukvr8.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="modals"></div>
  </body>
</html>
