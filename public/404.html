<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Stellar Burgers</title>
    <script>
      ((location) => {
        const pathSegmentsToKeep = 1;
        const repositoryRoot = location.pathname
          .split('/')
          .slice(0, pathSegmentsToKeep + 1)
          .join('/');
        const routePath = location.pathname
          .split('/')
          .slice(pathSegmentsToKeep + 1)
          .join('/');
        const query = location.search
          ? `&${location.search.slice(1).replace(/&/g, '~and~')}`
          : '';

        location.replace(
          `${location.protocol}//${location.host}${repositoryRoot}/?/${routePath}${query}${location.hash}`
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
